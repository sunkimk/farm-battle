<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>农场大作战</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  :root{--cream:#fff6dc;--cream2:#ffe9b0;--brown:#7a4a22;--brown2:#a8692f;--green:#6cc04a;--green-d:#3f8f2c;--orange:#ff8a2b;--red:#ef5a4c;--sky:#c9ecff}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;height:100dvh;overscroll-behavior:none;overflow:hidden;background:var(--sky);font-family:"ZCOOL KuaiLe","PingFang SC","Hiragino Sans GB",sans-serif;color:var(--brown);user-select:none;-webkit-user-select:none;touch-action:none}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #ui,#world{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .panel{background:var(--cream);border:3px solid var(--brown);border-radius:16px;box-shadow:0 4px 0 var(--brown),0 8px 14px rgba(70,40,10,.18)}
  #hud{display:none}
  body.playing #hud{display:block}
  #timer{position:absolute;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);padding:6px 18px 7px;font-size:20px;display:flex;align-items:center;gap:8px;border-radius:999px;white-space:nowrap}
  #timer b{font-weight:400;color:var(--red);font-size:24px;min-width:52px;text-align:center}
  #timer svg{width:22px;height:22px}
  #bossbar{display:none;width:230px;height:16px;border-radius:9px;background:#e9d3a0;border:2px solid var(--brown);overflow:hidden}
  #bossbar i{display:block;height:100%;background:linear-gradient(#ff8f7f,var(--red));transition:width .15s}
  #kills{position:absolute;top:calc(58px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:16px;color:#fff;text-shadow:0 2px 0 var(--brown),0 0 6px rgba(70,40,10,.5);white-space:nowrap}
  #tl{position:absolute;top:calc(10px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left));display:flex;flex-direction:column;gap:10px;width:214px}
  #stat{display:flex;align-items:center;gap:10px;padding:7px 12px 8px 8px}
  #lv{width:42px;height:42px;border-radius:50%;background:var(--orange);border:3px solid var(--brown);color:#fff;font-size:calc(var(--lf,21px)*var(--k,1));display:grid;place-items:center;text-shadow:0 2px 0 rgba(0,0,0,.25);flex:none}
  .bars{flex:1;display:flex;flex-direction:column;gap:5px}
  .bar{height:12px;border-radius:8px;background:#e9d3a0;border:2px solid var(--brown);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:6px;transition:width .2s}
  #hpbar i{background:linear-gradient(#a6e36f,var(--green))}
  #xpbar i{background:linear-gradient(#ffc36b,var(--orange))}
  #quest{padding:8px 12px 10px;font-size:15px}
  #quest h4{margin:0 0 4px;font-weight:400;font-size:13px;color:var(--brown2);display:flex;justify-content:space-between}
  #quest .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;gap:8px;white-space:nowrap}
  #quest .bar i{background:linear-gradient(#a6e36f,var(--green))}
  #mute{position:absolute;top:calc(10px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));width:40px;height:40px;padding:0;border-radius:50%;display:grid;place-items:center;pointer-events:auto;cursor:pointer}
  #mute svg{width:22px;height:22px}#mute .x{display:none}#mute.off .w{display:none}#mute.off .x{display:block}#mute:active{transform:translateY(2px)}
  #status{position:absolute;left:50%;bottom:24%;transform:translateX(-50%);padding:5px 14px;font-size:15px;border-radius:999px;opacity:0;transition:opacity .2s;white-space:nowrap}
  #status.on{opacity:1}
  #banner{position:absolute;left:50%;top:33%;transform:translate(-50%,-50%) scale(.6);font-size:clamp(18px,5.6vw,34px);color:#fff;opacity:0;transition:all .35s cubic-bezier(.3,1.6,.5,1);white-space:nowrap;text-shadow:0 3px 0 var(--brown),-2px 0 0 var(--brown),2px 0 0 var(--brown),0 -2px 0 var(--brown),0 8px 14px rgba(70,40,10,.35)}
  #banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #hint{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:14px;color:#fff;text-shadow:0 2px 0 var(--brown),0 0 6px rgba(70,40,10,.5);white-space:nowrap}
  #joy{position:absolute;left:calc(34px + env(safe-area-inset-left));bottom:calc(30px + env(safe-area-inset-bottom));width:130px;height:130px;border-radius:50%;background:rgba(255,246,220,.55);border:3px solid rgba(122,74,34,.75)}
  #knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:var(--green);border:3px solid var(--brown);box-shadow:0 4px 0 var(--green-d);display:grid;place-items:center}
  #knob svg{width:30px;height:30px}
  #dash{position:absolute;right:calc(40px + env(safe-area-inset-right));bottom:calc(40px + env(safe-area-inset-bottom));width:104px;height:104px;border-radius:50%;pointer-events:auto;cursor:pointer;background:conic-gradient(var(--orange) calc(var(--e,1)*360deg),#e9d3a0 0);border:3px solid var(--brown);box-shadow:0 5px 0 var(--brown),0 10px 16px rgba(70,40,10,.2);display:grid;place-items:center}
  #dash>div{width:80px;height:80px;border-radius:50%;background:var(--cream);border:3px solid var(--brown);display:grid;place-items:center;font-size:20px}
  #dash:active{transform:translateY(3px);box-shadow:0 2px 0 var(--brown)}
  #night{position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse at 50% 55%,rgba(60,50,150,.08) 30%,rgba(34,26,96,.6) 100%)}
  #rage{position:absolute;inset:0;display:none;box-shadow:inset 0 0 70px 10px rgba(239,60,50,.35)}
  #rage.on{display:block}
  #low{position:absolute;inset:0;display:none;box-shadow:inset 0 0 60px 8px rgba(239,60,50,.4)}
  #timer.hurry{animation:hurry .5s ease-in-out infinite alternate;border-color:var(--red)}
  @keyframes hurry{from{scale:1}to{scale:1.1}}
  @keyframes pulse{from{opacity:.25}to{opacity:1}}
  @keyframes beat{from{scale:.88}to{scale:1.08}}
  #bossIntro{position:absolute;inset:0;display:none}
  #bossIntro.on{display:block}
  #bossIntro .fl{position:absolute;inset:0;box-shadow:inset 0 0 90px 20px rgba(239,60,50,.55)}
  #bossIntro .st{position:absolute;left:0;width:100%;height:36px;background:repeating-linear-gradient(-45deg,#ffcf33 0 22px,#3a2a1a 22px 44px);background-size:62.2px 100%;animation:stripe .5s linear infinite,slideT .3s ease-out;border:3px solid #3a2a1a;border-width:3px 0}
  #bossIntro .st.t{top:0}#bossIntro .st.b{bottom:0;animation:stripe .5s linear infinite reverse,slideB .3s ease-out}
  @keyframes stripe{to{background-position:62.2px 0}}
  @keyframes slideT{from{transform:translateY(-100%)}}@keyframes slideB{from{transform:translateY(100%)}}
  #bossIntro .bcard{position:absolute;left:50%;top:74%;transform:translate(-50%,-50%);text-align:center;white-space:nowrap;animation:bpop .55s cubic-bezier(.3,1.7,.5,1)}
  @keyframes bpop{from{transform:translate(-50%,-50%) scale(.2);opacity:0}}
  #bossIntro .w{font-size:clamp(14px,4vw,20px);color:#ffcf33;letter-spacing:.3em;text-shadow:0 2px 0 #3a2a1a,0 0 12px rgba(0,0,0,.5)}
  #bossIntro .n{font-size:clamp(36px,11vw,58px);color:#fff;line-height:1.15;text-shadow:0 4px 0 #8a1c14,-3px 0 0 #8a1c14,3px 0 0 #8a1c14,0 -3px 0 #8a1c14,0 12px 22px rgba(0,0,0,.45)}
  #bossIntro .s{font-size:18px;color:#ffe9b0;text-shadow:0 2px 0 #3a2a1a}
  #hpArrow{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;display:none;transform:rotate(var(--a,0deg))}
  #hpArrow::after{content:"";position:absolute;right:-13px;top:50%;margin-top:-9px;border:9px solid transparent;border-left:13px solid var(--red)}
  #hpArrow div{width:100%;height:100%;border-radius:50%;background:var(--cream);border:3px solid var(--brown);display:grid;place-items:center;transform:rotate(calc(-1*var(--a,0deg)));animation:beat .45s ease-in-out infinite alternate;box-shadow:0 3px 0 var(--brown)}
  #hpArrow svg{width:26px;height:26px}
  @media (max-height:460px){#bossIntro .n{font-size:42px}}
  #hurt{position:absolute;inset:0;box-shadow:inset 0 0 90px 30px rgba(239,90,76,.75);opacity:0;transition:opacity .25s}
  .tagbar{position:absolute;transform:translate(-50%,-100%);display:flex;align-items:center;gap:3px;white-space:nowrap}
  .tagbar em{font-style:normal;min-width:21px;height:21px;padding:0 3px;border-radius:11px;background:#5b4636;color:#fff;font-size:13px;display:grid;place-items:center;border:2px solid #fff}
  .tagbar span{width:46px;height:9px;border-radius:6px;background:#5b4636;border:2px solid #fff;overflow:hidden}
  .tagbar span i{display:block;height:100%;background:var(--red)}
  .tagbar b{position:absolute;left:50%;bottom:135%;translate:-50% 0;background:#fff;border:2px solid var(--brown);border-radius:12px;padding:1px 9px 2px;font-size:14px;font-weight:400;color:var(--brown);white-space:nowrap;display:none;box-shadow:0 2px 0 var(--brown)}
  .tagbar b.on{display:block;animation:emo .25s cubic-bezier(.3,1.7,.5,1)}
  @keyframes emo{from{scale:.3;opacity:0}}
  .tagbar.me em{background:var(--orange)} .tagbar.me span i{background:var(--green)}
  .float{position:absolute;transform:translate(-50%,-50%);font-size:21px;color:#fff;text-shadow:0 2px 0 var(--brown),-1px 0 0 var(--brown),1px 0 0 var(--brown),0 -1px 0 var(--brown);animation:fl .8s ease-out forwards;white-space:nowrap}
  .float.xp{color:#ffd24a;font-size:17px}.float.big{font-size:30px;color:#ffe45c}.float.me{color:#ff8f7f}
  @keyframes fl{0%{opacity:0;margin-top:6px;scale:.6}15%{opacity:1;scale:1.15}30%{scale:1}100%{opacity:0;margin-top:-46px}}
  .overlay{position:fixed;inset:0;display:none;place-items:center;pointer-events:auto;background:rgba(60,40,20,.28);padding:14px}
  .overlay.on{display:grid}
  .sheet{padding:18px 22px 22px;text-align:center;max-width:94vw}
  h1{font-weight:400;font-size:clamp(26px,7vw,44px);margin:0;color:#fff;text-shadow:0 4px 0 var(--brown),-2px 0 0 var(--brown),2px 0 0 var(--brown),0 -2px 0 var(--brown),0 10px 18px rgba(70,40,10,.35);letter-spacing:2px}
  h2{font-weight:400;font-size:26px;margin:0 0 4px}
  .sub{font-size:16px;color:var(--brown2);margin:2px 0 12px}
  .cards{display:flex;gap:clamp(6px,1.6vw,14px);justify-content:center;flex-wrap:nowrap}
  .card{width:clamp(78px,min(21.5vw,34vh),230px);padding:clamp(4px,1vw,8px) clamp(4px,1vw,8px) clamp(6px,1.4vw,12px);cursor:pointer;text-align:center;transition:transform .15s;font-size:clamp(14px,2.6vw,18px)}
  .card:hover,.card:active{transform:translateY(-5px) scale(1.03)}
  .card.sel{border-color:var(--orange);box-shadow:0 4px 0 var(--orange),0 0 0 5px #ffd24a,0 12px 20px rgba(70,40,10,.28);transform:translateY(-6px) scale(1.05)}
  .mrow{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:6px}.mrow .btn{margin-top:0}
  .btn.alt{background:var(--cream);color:var(--brown);box-shadow:0 5px 0 var(--brown);text-shadow:none}.btn.alt:active{box-shadow:0 2px 0 var(--brown)}
  .btn.off{background:#b9c2a8;box-shadow:0 5px 0 #8a927c;pointer-events:none}
  .card canvas,.card img{width:100%;aspect-ratio:1;display:block;border-radius:12px;background:radial-gradient(#e9f8c9,#bfe79a)}
  .card small.q{color:var(--orange);font-size:13px}
  .dexg{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;text-align:left;width:min(820px,88vw);margin-top:8px}
  .dexi{display:flex;gap:10px;align-items:center;background:#fffbee;border:2px solid var(--brown2);border-radius:12px;padding:6px 10px 6px 6px}
  .dexi img{width:84px;height:84px;border-radius:10px;background:radial-gradient(#e9f8c9,#bfe79a);flex:none}
  .dexi b{font-weight:400;font-size:18px;display:block}.dexi i{font-style:normal;font-size:12px;color:#fff;background:var(--orange);border-radius:8px;padding:0 7px 1px;margin-left:6px;vertical-align:2px}.dexi i.bad{background:#8a6a9a}.dexi i.boss{background:var(--red)}
  .dexi small{font-size:13px;color:var(--brown2);line-height:1.4;display:block}
  #dex .sheet,#board .sheet{max-height:94vh;overflow:auto;touch-action:pan-y}
  #board,#dex{z-index:5}
  #board .sheet{width:min(460px,92vw)}
  .brow0{display:flex;align-items:center;gap:10px;justify-content:center;font-size:15px;margin:12px 0 0}.brow0 .btn{margin-top:0;font-size:18px;padding:6px 20px 8px}
  #bname{font:inherit;font-size:17px;color:var(--brown);width:150px;height:40px;padding:0 10px;border:2px solid var(--brown);border-radius:10px;background:#fff;text-align:center;user-select:text;-webkit-user-select:text;touch-action:auto;outline:none}
  .blist{display:flex;flex-direction:column;gap:5px;text-align:left}
  .bi{display:flex;align-items:center;gap:10px;padding:5px 12px 6px 8px;border-radius:11px;background:#fffbee;border:2px solid #e2c98f;font-size:16px}
  .bi.me{background:#ffe9b0;border-color:var(--orange)}.bi.new{box-shadow:0 0 0 3px #ffd24a}
  .bi u{text-decoration:none;width:28px;height:28px;border-radius:50%;background:#e9d3a0;display:grid;place-items:center;font-size:15px;flex:none}
  .bi:nth-child(1) u{background:#ffc928;color:#fff}.bi:nth-child(2) u{background:#c9ced6;color:#fff}.bi:nth-child(3) u{background:#d99a5a;color:#fff}
  .bi span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bi small{font-size:12px;color:var(--brown2);margin-left:6px}
  .bi i{font-style:normal;font-size:11px;color:#fff;background:#8a6a9a;border-radius:8px;padding:0 6px 1px;margin-left:6px;vertical-align:1px}.bi.me i{background:var(--orange)}
  .bi b{font-weight:400;font-size:19px;color:var(--orange)}
  #endRank{font-size:17px;margin-top:10px}#endRank b{font-weight:400;font-size:26px;color:var(--orange)}#endRank em{font-style:normal;color:#fff;background:var(--red);border-radius:9px;padding:0 8px 1px;margin-left:8px;font-size:14px}
  .card small{display:block;font-size:13px;color:var(--brown2);margin-top:2px}
  #menu{background:rgba(120,170,90,.18)}
  #menu .wrap{display:flex;flex-direction:column;align-items:center;gap:8px}
  #menu .tip{text-align:center;max-width:92vw;font-size:clamp(12px,3.2vw,14px);color:#fff;text-shadow:0 2px 0 var(--brown);margin-top:6px}
  .ups{display:flex;flex-direction:column;gap:10px;min-width:280px}
  .up{display:flex;align-items:center;gap:12px;padding:9px 16px 10px 10px;font-size:19px;cursor:pointer;text-align:left;transition:transform .12s}
  .up:hover,.up:active{transform:scale(1.04)}
  .up b{font-weight:400;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;border:3px solid var(--brown);font-size:20px;flex:none;text-shadow:0 2px 0 rgba(0,0,0,.2)}
  .up small{display:block;font-size:13px;color:var(--brown2)}
  .up kbd{margin-left:auto;font-family:inherit;font-size:13px;color:var(--brown2);border:2px solid var(--brown2);border-radius:6px;padding:0 6px}
  .btn{display:inline-block;margin-top:14px;padding:9px 30px 11px;font-size:22px;color:#fff;background:var(--green);border:3px solid var(--brown);border-radius:999px;box-shadow:0 5px 0 var(--green-d);cursor:pointer;text-shadow:0 2px 0 rgba(0,0,0,.2)}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--green-d)}
  .stats{display:flex;gap:18px;justify-content:center;font-size:17px;margin-top:8px}
  .stats b{display:block;font-weight:400;font-size:30px;color:var(--orange)}
  @media (pointer:coarse){#hint{display:none}}
  @media (orientation:portrait) and (max-width:640px){
    #timer{left:auto;right:calc(60px + env(safe-area-inset-right));transform:none;font-size:15px;padding:0 13px;height:40px;gap:5px;box-shadow:0 3px 0 var(--brown)}#timer b{font-size:20px;min-width:44px}#timer svg{width:18px;height:18px}#bossbar{width:86px;height:12px}
    #tlabel{display:none}#timer.hurry{animation:none}
    #mute{box-shadow:0 3px 0 var(--brown)}
    #tl{width:158px;gap:7px}#stat{padding:0 11px 0 4px;gap:7px;height:40px;border-radius:999px;box-shadow:0 3px 0 var(--brown)}#lv{--lf:16px;width:30px;height:30px;border-width:2px}.bars{gap:3px}#stat .bar{height:9px}
    #quest{padding:5px 10px 7px;font-size:13px;border-radius:13px;border-width:2px;box-shadow:0 3px 0 var(--brown)}#quest h4{display:none}#quest .row{margin-bottom:3px}#quest .bar{height:7px;border-width:1.5px}
    #kills{top:calc(57px + env(safe-area-inset-top));left:auto;right:calc(12px + env(safe-area-inset-right));transform:none;font-size:13px}#hint{display:none}
    #joy{left:calc(22px + env(safe-area-inset-left));bottom:calc(44px + env(safe-area-inset-bottom))}#dash{right:calc(24px + env(safe-area-inset-right));bottom:calc(52px + env(safe-area-inset-bottom))}
    .cards{flex-wrap:wrap;max-width:96vw}.card{width:min(43vw,22vh)}.card small.q{display:none}.ups{min-width:0;width:82vw}.stats{gap:10px;font-size:14px}.stats b{font-size:24px}.sheet{padding:14px 14px 18px}}
  @media (max-height:460px){#tl{width:190px;transform:scale(.86);transform-origin:top left}#joy{width:112px;height:112px}#dash{width:90px;height:90px}#dash>div{width:68px;height:68px;font-size:17px}#hint{display:none}
    h1{font-size:28px}.card{width:clamp(88px,30vh,130px);font-size:14px;padding:5px 5px 7px}.card small.q{display:none}#menu .tip.last{display:none}#menu .wrap{gap:5px}#timer{font-size:16px;padding:4px 14px 5px}#timer b{font-size:20px}#kills{top:calc(48px + env(safe-area-inset-top));font-size:14px}.mrow .btn{font-size:18px;padding:6px 22px 8px}.sub{margin-bottom:6px}.up{font-size:16px;padding:5px 12px 6px 8px}.up b{width:32px;height:32px;font-size:16px}.ups{gap:7px}h2{font-size:21px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="world"></div>
<div id="ui">
  <div id="night"></div><div id="hurt"></div>
  <div id="hud">
    <div id="timer" class="panel">
      <svg viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="#ffc94a" stroke="#7a4a22" stroke-width="2" stroke-linejoin="round"/></svg>
      <span id="tlabel">离天黑还有</span> <b id="time">2:00</b><div id="bossbar"><i style="width:100%"></i></div>
    </div>
    <div id="kills">赶跑捣蛋鬼 0</div>
    <div id="tl">
      <div id="stat" class="panel"><div id="lv">1</div><div class="bars"><div class="bar" id="hpbar"><i style="width:100%"></i></div><div class="bar" id="xpbar"><i style="width:0%"></i></div></div></div>
      <div id="quest" class="panel"><h4><span>农场任务</span><span id="qi">1 / 5</span></h4><div class="row"><span id="qt"></span><span id="qn"></span></div><div class="bar"><i id="qb" style="width:0%"></i></div></div>
    </div>
    <div id="mute" class="panel" aria-label="声音开关"><svg viewBox="0 0 24 24" fill="none" stroke="#7a4a22" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.500V5.500L7.500 9.500H4z" fill="#ff8a2b"/><path class="w" d="M15.500 9.500a3.500 3.500 0 0 1 0 5M18 7a7 7 0 0 1 0 10"/><path class="x" d="M16 9.500l5 5M21 9.500l-5 5"/></svg></div>
    <div id="status" class="panel"></div>
    <div id="joy"><div id="knob"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="1.6" fill="#fff"/><path d="M12 4.5v5M12 14.5v5M4.5 12h5M14.5 12h5"/></svg></div></div>
    <div id="dash"><div>冲刺</div></div>
    <div id="hint">按住鼠标 或 WASD 控制方向 · 空格 / 右键 冲刺 · 把车身横过来，侧炮会自动开火</div>

/* fireflies (night) */

    if(got){scene.remove(h.g);scene.remove(h.gl);h.gl.material.dispose();hearts.splice(i,1);if(near(h.x,h.z))puff(h.x,1.4,h.z,0xff8a9a,10,4,.8);if(near(h.x,h.z))ringFx(h.x,h.z,0xff8a9a,5,.5);if(got.isPlayer){floatAt('奶奶的苹果派 +40%',got.x,3.8*got.scale,got.z,'big');tone(660,990,.12,'sine',.07);tone(990,1320,.16,'sine',.07,.1);emote(got,'好香~',1.3);}}}
  if(phase==='day'&&carrots.length<95&&rnd()<dt*5)scatterCarrot();
  if(phase==='day'){timeLeft-=dt;if(timeLeft<=0)startNight();else{/* the boss peeks over the east fence */const B=boss;B.x=HALF+7.5;B.z+=(clamp(player.z,-HALF+8,HALF-8)-B.z)*Math.min(1,dt*.5);B.g.visible=true;B.g.position.set(B.x,0,B.z);B.g.rotation.y=Math.atan2(player.x-B.x,player.z-B.z);B.b.position.y=Math.abs(Math.sin(simT*2.2))*.3;}}else if(phase==='night'){nightT+=dt;if(nightT>2.6)spawnBoss();}
  else if(phase==='intro'){introT+=dt;const k=clamp((introT-.6)/.6,0,1),e=1+2.70158*Math.pow(k-1,3)+1.70158*Math.pow(k-1,2);boss.g.scale.setScalar(1.15*Math.max(.001,e));
    if(!boss.popped&&introT>.6){boss.popped=true;shake=.4;SFX.stomp();for(let i=0;i<28;i++){const a=i/28*6.28;puff(boss.x+Math.sin(a)*3,.6,boss.z+Math.cos(a)*3,0xe9dcae,1,7,2.2);}}
    if(!boss.roared&&introT>1.3){boss.roared=true;shake=.4;SFX.roar();}
    if(boss.roared)boss.b.rotation.x=-Math.sin(clamp((introT-1.3)/.8,0,1)*Math.PI)*.25;
    if(introT>3){phase='boss';$('bossIntro').classList.remove('on');boss.g.scale.setScalar(1.15);boss.b.rotation.x=0;showBanner('绕着它转，用侧炮打！',2.4);}}
  if(pending>0&&state==='play'&&player.alive)showLevelUp();
  updateHud();}

function fx(dt){rgbMat.emissive.setHSL((simT*.12)%1,1,.5);for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.t+=dt;const k=Math.min(1,r.t/r.life),e=1-Math.pow(1-k,3);r.m.scale.setScalar(Math.max(.1,r.R*e));r.m.material.opacity=.9*(1-k);if(k>=1){scene.remove(r.m);r.m.material.dispose();rings.splice(i,1);}}
  {let n=0;for(const c of carrots){if(n>=GLOWN)break;dummy.position.set(c.x,.06,c.z);dummy.rotation.set(-Math.PI/2,0,0);dummy.scale.setScalar(1.9);dummy.updateMatrix();glow.setMatrixAt(n++,dummy.matrix);}glow.count=n;glow.instanceMatrix.needsUpdate=true;
    n=0;for(const c of carrots){if(n>=CARN)break;dummy.position.set(c.x,c.y+Math.sin(c.t*3)*.14,c.z);dummy.rotation.set(0,c.ry,.35);dummy.scale.setScalar(1.3);dummy.updateMatrix();carBody.setMatrixAt(n,dummy.matrix);for(let k=0;k<3;k++){tmpM.multiplyMatrices(dummy.matrix,LEAFM[k]);carLeaf.setMatrixAt(n*3+k,tmpM);}n++;}
    carBody.count=n;carLeaf.count=n*3;carBody.instanceMatrix.needsUpdate=true;carLeaf.instanceMatrix.needsUpdate=true;}
  {let n=0;for(let i=puffs.length-1;i>=0;i--){const p=puffs[i];p.t+=dt;const k=p.t/p.life;if(k>=1){puffs.splice(i,1);continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.vx*=.92;p.vz*=.92;
    dummy.position.set(p.x,p.y,p.z);dummy.rotation.set(0,0,0);dummy.scale.setScalar(p.s*(.4+k*1.1)*(1-k*k*k));dummy.updateMatrix();puffMesh.setMatrixAt(n,dummy.matrix);puffMesh.setColorAt(n,puffCol.setHex(p.c));n++;}
    puffMesh.count=n;puffMesh.instanceMatrix.needsUpdate=true;if(puffMesh.instanceColor)puffMesh.instanceColor.needsUpdate=true;}
  if(bannerT>0){bannerT-=dt;if(bannerT<=0)$('banner').classList.remove('on');}
  const tk=phase==='day'?0:1;nightK+=(tk-nightK)*Math.min(1,dt*.8);
  duskG=phase==='day'?clamp((50-timeLeft)/50,0,1)*.9:Math.max(0,.9-nightK*2);
  scene.background.copy(SKY_DAY).lerp(tmpC.setHex(0xffd2a8),duskG).lerp(SKY_NIGHT,nightK);scene.fog.color.copy(scene.background);hemi.intensity=1.5;hemi.color.setHex(0xe6f6ff).lerp(tmpC.setHex(0xffdcb8),duskG).lerp(tmpC.setHex(0xb9bcff),nightK);hemi.groundColor.setHex(0xa5d46a).lerp(tmpC.setHex(0x9ac49a),nightK);
  sun.intensity=2.3-nightK*.35;sun.color.setHex(0xfff1cf).lerp(tmpC.setHex(0xff9a50),duskG).lerp(tmpC.setHex(0xcfc9ff),nightK);$('night').style.opacity=nightK;lampMat.emissiveIntensity=.5+nightK*2;flies.material.opacity=nightK*.9;flies.position.y=Math.sin(simT*.8)*.4;flies.rotation.y=simT*.02;}
const AUTO=Q.has('auto');const tmpC=new THREE.Color(),CAMK=+(Q.get('cam')||1),CAMY=+(Q.get('camy')||1);

function render(dt){let cx=0,cz=0,target=1;
  if(player){cx=player.x;cz=player.z;target=1+(player.vscale-1)*.75;if(phase==='boss'&&boss.alive){target=Math.max(target,1.75);cx=player.x*.8+boss.x*.2;cz=player.z*.8+boss.z*.2;}
    if(phase==='intro'){const k=clamp(Math.min(introT/.6,(3-introT)/.5),0,1),m=k*k*(3-2*k)*.92;cx=player.x+(boss.x-player.x)*m;cz=player.z+(boss.z-player.z)*m;target=1.2;}}
  else{target=1.6;cx=Math.sin(simT*.12)*14;cz=Math.cos(simT*.12)*10;}
  camF+=(target-camF)*Math.min(1,dt*2.5);shake=Math.max(0,shake-dt*1.6);const sx=(rnd()-.5)*shake*.5,sz=(rnd()-.5)*shake*.5;
  const cf=camF*CAMK;camera.position.set(cx+sx,17.5*cf*CAMY,cz+13*cf+sz);camera.lookAt(cx+sx,1,cz-1.5+sz);scene.fog.near=52*camF;scene.fog.far=125*camF;
  sun.position.set(cx-26-duskG*16,46-duskG*20,cz+18);sun.target.position.set(cx,0,cz);
  for(const v of vehicles){if(v.emoT>0){v.emoT-=dt;if(v.emoT<=0)v.tag.children[2].classList.remove('on');}if(v.alive)updateVis(v,dt);else if(v.koT>0){v.koT-=dt;const R=v.vis.root,k=v.koT/.75;R.position.y+=dt*16*k;R.rotation.z+=dt*11;R.rotation.x+=dt*7;R.scale.setScalar(v.vscale*(.35+.65*k));if(rnd()<dt*30)puff(R.position.x,R.position.y+1,R.position.z,0xffffff,1,1,.8);if(v.koT<=0){puff(R.position.x,R.position.y+1,R.position.z,0xfff0a0,8,5,1);R.visible=false;R.rotation.set(0,0,0);R.position.y=0;}}
    if(!v.alive)continue;tmp.set(v.x,(v.isPlayer?3.3:3.1)*v.vscale+.3,v.z).project(camera);const vis=Math.abs(tmp.x)<1.1&&Math.abs(tmp.y)<1.1;v.tag.style.display=vis?'flex':'none';if(vis){v.tag.style.left=(tmp.x*.5+.5)*innerWidth+'px';v.tag.style.top=(-tmp.y*.5+.5)*innerHeight+'px';v.tag.firstChild.textContent=v.lv>=MAXLV?'满':v.lv;v.tag.children[1].firstChild.style.width=clamp(v.hp/stats(v).maxhp*100,0,100)+'%';}}
  fovKick=Math.max(0,fovKick-dt*2.2);{const f=baseFov+fovKick*fovKick*7;if(Math.abs(camera.fov-f)>.01){camera.fov=f;camera.updateProjectionMatrix();}}
  {const ar=$('hpArrow');let show=false;if(player&&player.alive&&state==='play'&&hearts.length&&player.hp<stats(player).maxhp*.6){let best=null,bd=1e9;for(const h of hearts){const d=Math.hypot(h.x-player.x,h.z-player.z);if(d<bd){bd=d;best=h;}}
    tmp.set(best.x,1,best.z).project(camera);if(Math.abs(tmp.x)>.9||Math.abs(tmp.y)>.85){const a=Math.atan2(best.z-player.z,best.x-player.x),R=Math.min(innerWidth,innerHeight)*.36;ar.style.left=innerWidth/2+Math.cos(a)*R*1.25+'px';ar.style.top=innerHeight/2+Math.sin(a)*R+'px';ar.style.setProperty('--a',a*180/Math.PI+'deg');show=true;}}
    ar.style.display=show?'block':'none';}
  if(blobs){let n=0;for(const v of vehicles){if(!v.alive||n>=23)continue;dummy.position.set(v.x-.25,.06,v.z+.2);dummy.rotation.set(-Math.PI/2,0,v.h);dummy.scale.set(1.5*v.vscale,2.1*v.vscale,1);dummy.updateMatrix();blobs.setMatrixAt(n++,dummy.matrix);}
    if(boss&&boss.g.visible){dummy.position.set(boss.x-.4,.06,boss.z+.3);dummy.rotation.set(-Math.PI/2,0,boss.h);const bs=boss.g.scale.x/1.15;dummy.scale.set(3*bs,4.2*bs,1);dummy.updateMatrix();blobs.setMatrixAt(n++,dummy.matrix);}blobs.count=n;blobs.instanceMatrix.needsUpdate=true;}
  renderer.render(scene,camera);}
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;baseFov=innerWidth/innerHeight>1.3?38:56;camera.fov=baseFov;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
let last=performance.now();
function frame(now){if(MOBILE&&now-last<30){requestAnimationFrame(frame);return;}let dt=Math.min(.05,(now-last)/1000);last=now;if(state==='menu')menuFrame(dt);if(freeze>0){freeze-=dt;dt*=.06;}step(dt);fx(dt);render(dt);requestAnimationFrame(frame);}

/* menu */
const HEROES=[0,1,2,6],looks={};HEROES.forEach(t=>looks[t]=defaultLook(t));let sel=-1;
const PV={r:new THREE.WebGLRenderer({antialias:true,alpha:true}),sc:new THREE.Scene(),cam:new THREE.PerspectiveCamera(30,1,.1,60),items:[]};
PV.r.setPixelRatio(1);PV.r.setSize(340,340);PV.sc.add(new THREE.HemisphereLight(0xffffff,0xb9dc8a,1.6));{const d=new THREE.DirectionalLight(0xfff1cf,2.2);d.position.set(-4,8,6);PV.sc.add(d);}
PV.cam.position.set(0,3.3,7.9);PV.cam.lookAt(0,1.35,0);
function pvBuild(i){const it=PV.items[i];if(it.v)PV.sc.remove(it.v.root);it.v=buildVehicle(it.type,looks[it.type]);it.v.L[0].visible=it.v.R[0].visible=true;it.v.root.visible=false;PV.sc.add(it.v.root);it.pop=1;}
HEROES.forEach((t,i)=>{const T=TYPES[t];const d=document.createElement('div');d.className='card panel';d.innerHTML=`<canvas width="340" height="340"></canvas><div>${T.name}</div><small>${T.car}</small><small class="q">「${T.quote}」</small>`;
  const it={d,type:t,ctx:d.firstChild.getContext('2d'),yaw:i*2.1,hover:false,v:null,pop:0};PV.items.push(it);pvBuild(i);it.pop=0;
  d.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')it.hover=true;});d.addEventListener('pointerleave',()=>it.hover=false);
  d.addEventListener('click',()=>{unlockAudio();sel=t;it.pop=1;PV.items.forEach((o,k)=>o.d.classList.toggle('sel',k===i));const go=$('go');go.classList.remove('off');go.textContent='开始游戏';tone(700,1000,.1,'triangle',.06);});$('cards').appendChild(d);});
$('reroll').addEventListener('click',()=>{unlockAudio();HEROES.forEach((t,i)=>{looks[t]=randLook(t);pvBuild(i);});tone(500,900,.12,'triangle',.06);});
$('go').addEventListener('click',()=>{if(sel>=0&&state==='menu')startGame(sel);});
const DEX=[[0,'主角','','急性子，一着急刺就炸起来。开着爷爷留下的旧拖拉机。「让开让开！」'],[1,'主角','','慢吞吞的发明家，矿车是自己焊的，总在掉零件。「等等，我螺丝呢？」'],[2,'主角','','爱臭美的飙车手，每次冲刺前都要先理一下耳朵。「发型不能乱。」'],[6,'主角','','隔壁搬来的老爷爷，一年四季穿皮衣。把旧显卡改成了车，从 1060 一路升级到 5090，据说最后得拖着一座发电站才带得动。「算力就是马力！」'],
  [3,'捣蛋鬼','bad','骑着自行车来偷菜，嘴里能装下半个农场。跑得快，不经打，挨两下就溜。'],[4,'捣蛋鬼','bad','推着超市购物车，专扔烂番茄，射程比别人远。它管那叫「陈年佳酿」。'],[5,'捣蛋鬼','bad','头上顶着偷来的锅，皮厚、跑得慢，认准了就横冲直撞。'],
  [-1,'头目','boss','大野猪老大，贪吃。白天躲在东边栅栏外流口水，天黑了才敢进来抢收成。']];
let dexBuilt=false;
$('dexBtn').addEventListener('click',()=>{unlockAudio();if(!dexBuilt&&PV.r){dexBuilt=true;PV.items.forEach(o=>o.v.root.visible=false);
    for(const e of DEX){let o;if(e[0]<0){o=buildBoss(true);o.scale.setScalar(.5);o.position.y=.1;o.rotation.y=.62;}else{const v=buildVehicle(e[0]);v.L[0].visible=v.R[0].visible=true;o=v.root;o.rotation.y=.62;}
      PV.sc.add(o);PV.r.render(PV.sc,PV.cam);const url=PV.r.domElement.toDataURL();PV.sc.remove(o);const d=document.createElement('div');d.className='dexi';const nm=e[0]<0?'拱拱':TYPES[e[0]].name;
      d.innerHTML=`<img src="${url}" alt=""><div><b>${nm}<i class="${e[2]}">${e[1]}</i></b><small>${e[3]}</small></div>`;$('dexg').appendChild(d);}}
  $('dex').classList.add('on');});
$('dexX').addEventListener('click',()=>$('dex').classList.remove('on'));
function menuFrame(dt){if(!PV.r)return;const POSE=.62;PV.items.forEach((it,i)=>{if(it.hover||sel===it.type)it.yaw+=angDiff(POSE,it.yaw)*Math.min(1,dt*9);else it.yaw+=dt*1.1;it.pop=Math.max(0,it.pop-dt*3);
    const V=it.v,ps=1+Math.sin(it.pop*Math.PI)*.12;V.root.rotation.y=it.yaw;V.root.scale.setScalar(ps);V.critter.position.y=V.seatY+Math.abs(Math.sin(simT*5+i))*.035;V.critter.rotation.z=Math.sin(simT*3+i)*.05;
    PV.items.forEach(o=>o.v.root.visible=o===it);PV.r.render(PV.sc,PV.cam);it.ctx.clearRect(0,0,340,340);it.ctx.drawImage(PV.r.domElement,0,0,340,340);});}
window.__game={get info(){return{calls:renderer.info.render.calls,tris:renderer.info.render.triangles};},get player(){return player;},get boss(){return boss;},get state(){return state;},get phase(){return phase;},vehicles,carrots,shots,hearts,spawnHeart,startGame,startNight,setLevel,stats,gainXp,advance(sec){for(let i=0;i<sec*60;i++){step(1/60);fx(1/60);}render(1/60);}};
if(Q.has('pick'))startGame(+Q.get('pick'));
requestAnimationFrame(frame);
</script>
