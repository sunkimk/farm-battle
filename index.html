<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>菜园大作战</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  :root{--cream:#fff6dc;--cream2:#ffe9b0;--brown:#7a4a22;--brown2:#a8692f;--green:#6cc04a;--green-d:#3f8f2c;--orange:#ff8a2b;--red:#ef5a4c;--sky:#c9ecff}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--sky);font-family:"ZCOOL KuaiLe","PingFang SC","Hiragino Sans GB",sans-serif;color:var(--brown);user-select:none;-webkit-user-select:none;touch-action:none}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #ui,#world{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .panel{background:var(--cream);border:3px solid var(--brown);border-radius:16px;box-shadow:0 4px 0 var(--brown),0 8px 14px rgba(70,40,10,.18)}
  #hud{display:none}
  body.playing #hud{display:block}
  #timer{position:absolute;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);padding:6px 18px 7px;font-size:20px;display:flex;align-items:center;gap:8px;border-radius:999px;white-space:nowrap}
  #timer b{font-weight:400;color:var(--red);font-size:24px;min-width:52px;text-align:center}
  #timer svg{width:22px;height:22px}
  #bossbar{display:none;width:230px;height:16px;border-radius:9px;background:#e9d3a0;border:2px solid var(--brown);overflow:hidden}
  #bossbar i{display:block;height:100%;background:linear-gradient(#ff8f7f,var(--red));transition:width .15s}
  #kills{position:absolute;top:calc(58px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:16px;color:#fff;text-shadow:0 2px 0 var(--brown),0 0 6px rgba(70,40,10,.5);white-space:nowrap}
  #tl{position:absolute;top:calc(10px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left));display:flex;flex-direction:column;gap:10px;width:214px}
  #stat{display:flex;align-items:center;gap:10px;padding:7px 12px 8px 8px}
  #lv{width:42px;height:42px;border-radius:50%;background:var(--orange);border:3px solid var(--brown);color:#fff;font-size:21px;display:grid;place-items:center;text-shadow:0 2px 0 rgba(0,0,0,.25);flex:none}
  .bars{flex:1;display:flex;flex-direction:column;gap:5px}
  .bar{height:12px;border-radius:8px;background:#e9d3a0;border:2px solid var(--brown);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:6px;transition:width .2s}
  #hpbar i{background:linear-gradient(#a6e36f,var(--green))}
  #xpbar i{background:linear-gradient(#ffc36b,var(--orange))}
  #quest{padding:8px 12px 10px;font-size:15px}
  #quest h4{margin:0 0 4px;font-weight:400;font-size:13px;color:var(--brown2);display:flex;justify-content:space-between}
  #quest .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;gap:8px;white-space:nowrap}
  #quest .bar i{background:linear-gradient(#a6e36f,var(--green))}
  #mute{position:absolute;top:calc(10px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));padding:5px 12px;font-size:14px;border-radius:999px;background:var(--cream2);pointer-events:auto;cursor:pointer}
  #status{position:absolute;left:50%;bottom:24%;transform:translateX(-50%);padding:5px 14px;font-size:15px;border-radius:999px;opacity:0;transition:opacity .2s;white-space:nowrap}
  #status.on{opacity:1}
  #banner{position:absolute;left:50%;top:33%;transform:translate(-50%,-50%) scale(.6);font-size:34px;color:#fff;opacity:0;transition:all .35s cubic-bezier(.3,1.6,.5,1);white-space:nowrap;text-shadow:0 3px 0 var(--brown),-2px 0 0 var(--brown),2px 0 0 var(--brown),0 -2px 0 var(--brown),0 8px 14px rgba(70,40,10,.35)}
  #banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #hint{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:14px;color:#fff;text-shadow:0 2px 0 var(--brown),0 0 6px rgba(70,40,10,.5);white-space:nowrap}
  #joy{position:absolute;left:calc(34px + env(safe-area-inset-left));bottom:calc(30px + env(safe-area-inset-bottom));width:130px;height:130px;border-radius:50%;background:rgba(255,246,220,.55);border:3px solid rgba(122,74,34,.75)}
  #knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:var(--green);border:3px solid var(--brown);box-shadow:0 4px 0 var(--green-d);display:grid;place-items:center}
  #knob svg{width:30px;height:30px}
  #dash{position:absolute;right:calc(40px + env(safe-area-inset-right));bottom:calc(40px + env(safe-area-inset-bottom));width:104px;height:104px;border-radius:50%;pointer-events:auto;cursor:pointer;background:conic-gradient(var(--orange) calc(var(--e,1)*360deg),#e9d3a0 0);border:3px solid var(--brown);box-shadow:0 5px 0 var(--brown),0 10px 16px rgba(70,40,10,.2);display:grid;place-items:center}
  #dash>div{width:80px;height:80px;border-radius:50%;background:var(--cream);border:3px solid var(--brown);display:grid;place-items:center;font-size:20px}
  #dash:active{transform:translateY(3px);box-shadow:0 2px 0 var(--brown)}
  #night{position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse at 50% 55%,rgba(60,50,150,.08) 30%,rgba(34,26,96,.6) 100%)}
  #rage{position:absolute;inset:0;display:none;box-shadow:inset 0 0 80px 18px rgba(239,60,50,.55);animation:pulse .7s ease-in-out infinite alternate}
  #rage.on{display:block}
  #low{position:absolute;inset:0;display:none;box-shadow:inset 0 0 70px 14px rgba(239,60,50,.6);animation:pulse .45s ease-in-out infinite alternate}
  #timer.hurry{animation:hurry .5s ease-in-out infinite alternate;border-color:var(--red)}
  @keyframes hurry{from{scale:1}to{scale:1.1}}
  @keyframes pulse{from{opacity:.25}to{opacity:1}}
  @keyframes beat{from{scale:.88}to{scale:1.08}}
  #bossIntro{position:absolute;inset:0;display:none}
  #bossIntro.on{display:block}
  #bossIntro .fl{position:absolute;inset:0;box-shadow:inset 0 0 110px 30px rgba(239,60,50,.8);animation:pulse .32s ease-in-out infinite alternate}
  #bossIntro .st{position:absolute;left:0;width:100%;height:36px;background:repeating-linear-gradient(-45deg,#ffcf33 0 22px,#3a2a1a 22px 44px);background-size:62.2px 100%;animation:stripe .5s linear infinite,slideT .3s ease-out;border:3px solid #3a2a1a;border-width:3px 0}
  #bossIntro .st.t{top:0}#bossIntro .st.b{bottom:0;animation:stripe .5s linear infinite reverse,slideB .3s ease-out}
  @keyframes stripe{to{background-position:62.2px 0}}
  @keyframes slideT{from{transform:translateY(-100%)}}@keyframes slideB{from{transform:translateY(100%)}}
  #bossIntro .bcard{position:absolute;left:50%;top:74%;transform:translate(-50%,-50%);text-align:center;white-space:nowrap;animation:bpop .55s cubic-bezier(.3,1.7,.5,1)}
  @keyframes bpop{from{transform:translate(-50%,-50%) scale(.2);opacity:0}}
  #bossIntro .w{font-size:20px;color:#ffcf33;letter-spacing:8px;text-shadow:0 2px 0 #3a2a1a,0 0 12px rgba(0,0,0,.5)}
  #bossIntro .n{font-size:58px;color:#fff;line-height:1.15;text-shadow:0 4px 0 #8a1c14,-3px 0 0 #8a1c14,3px 0 0 #8a1c14,0 -3px 0 #8a1c14,0 12px 22px rgba(0,0,0,.45)}
  #bossIntro .s{font-size:18px;color:#ffe9b0;text-shadow:0 2px 0 #3a2a1a}
  #hpArrow{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;display:none;transform:rotate(var(--a,0deg))}
  #hpArrow::after{content:"";position:absolute;right:-13px;top:50%;margin-top:-9px;border:9px solid transparent;border-left:13px solid var(--red)}
  #hpArrow div{width:100%;height:100%;border-radius:50%;background:var(--cream);border:3px solid var(--brown);display:grid;place-items:center;transform:rotate(calc(-1*var(--a,0deg)));animation:beat .45s ease-in-out infinite alternate;box-shadow:0 3px 0 var(--brown)}
  #hpArrow svg{width:26px;height:26px}
  @media (max-height:460px){#bossIntro .n{font-size:42px}}
  #hurt{position:absolute;inset:0;box-shadow:inset 0 0 90px 30px rgba(239,90,76,.75);opacity:0;transition:opacity .25s}
  .tagbar{position:absolute;transform:translate(-50%,-100%);display:flex;align-items:center;gap:3px;white-space:nowrap}
  .tagbar em{font-style:normal;min-width:21px;height:21px;padding:0 3px;border-radius:11px;background:#5b4636;color:#fff;font-size:13px;display:grid;place-items:center;border:2px solid #fff}
  .tagbar span{width:46px;height:9px;border-radius:6px;background:#5b4636;border:2px solid #fff;overflow:hidden}
  .tagbar span i{display:block;height:100%;background:var(--red)}
  .tagbar.me em{background:var(--orange)} .tagbar.me span i{background:var(--green)}
  .float{position:absolute;transform:translate(-50%,-50%);font-size:21px;color:#fff;text-shadow:0 2px 0 var(--brown),-1px 0 0 var(--brown),1px 0 0 var(--brown),0 -1px 0 var(--brown);animation:fl .8s ease-out forwards;white-space:nowrap}
  .float.xp{color:#ffd24a;font-size:17px}.float.big{font-size:30px;color:#ffe45c}.float.me{color:#ff8f7f}
  @keyframes fl{0%{opacity:0;margin-top:6px;scale:.6}15%{opacity:1;scale:1.15}30%{scale:1}100%{opacity:0;margin-top:-46px}}
  .overlay{position:fixed;inset:0;display:none;place-items:center;pointer-events:auto;background:rgba(60,40,20,.28);padding:14px}
  .overlay.on{display:grid}
  .sheet{padding:18px 22px 22px;text-align:center;max-width:94vw}
  h1{font-weight:400;font-size:44px;margin:0;color:#fff;text-shadow:0 4px 0 var(--brown),-2px 0 0 var(--brown),2px 0 0 var(--brown),0 -2px 0 var(--brown),0 10px 18px rgba(70,40,10,.35);letter-spacing:2px}
  h2{font-weight:400;font-size:26px;margin:0 0 4px}
  .sub{font-size:16px;color:var(--brown2);margin:2px 0 12px}
  .cards{display:flex;gap:14px;justify-content:center;flex-wrap:nowrap}
  .card{width:clamp(150px,min(21vw,32vh),250px);padding:8px 8px 12px;cursor:pointer;text-align:center;transition:transform .15s;font-size:18px}
  .card:hover,.card:active{transform:translateY(-5px) scale(1.03)}
  .card.sel{border-color:var(--orange);box-shadow:0 4px 0 var(--orange),0 0 0 5px #ffd24a,0 12px 20px rgba(70,40,10,.28);transform:translateY(-6px) scale(1.05)}
  .mrow{display:flex;gap:14px;align-items:center;margin-top:6px}.mrow .btn{margin-top:0}
  .btn.alt{background:var(--cream);color:var(--brown);box-shadow:0 5px 0 var(--brown);text-shadow:none}.btn.alt:active{box-shadow:0 2px 0 var(--brown)}
  .btn.off{background:#b9c2a8;box-shadow:0 5px 0 #8a927c;pointer-events:none}
  .card canvas,.card img{width:100%;aspect-ratio:1;display:block;border-radius:12px;background:radial-gradient(#e9f8c9,#bfe79a)}
  .card small{display:block;font-size:13px;color:var(--brown2);margin-top:2px}
  #menu{background:rgba(120,170,90,.18)}
  #menu .wrap{display:flex;flex-direction:column;align-items:center;gap:8px}
  #menu .tip{font-size:14px;color:#fff;text-shadow:0 2px 0 var(--brown);margin-top:6px}
  .ups{display:flex;flex-direction:column;gap:10px;min-width:280px}
  .up{display:flex;align-items:center;gap:12px;padding:9px 16px 10px 10px;font-size:19px;cursor:pointer;text-align:left;transition:transform .12s}
  .up:hover,.up:active{transform:scale(1.04)}
  .up b{font-weight:400;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;border:3px solid var(--brown);font-size:20px;flex:none;text-shadow:0 2px 0 rgba(0,0,0,.2)}
  .up small{display:block;font-size:13px;color:var(--brown2)}
  .up kbd{margin-left:auto;font-family:inherit;font-size:13px;color:var(--brown2);border:2px solid var(--brown2);border-radius:6px;padding:0 6px}
  .btn{display:inline-block;margin-top:14px;padding:9px 30px 11px;font-size:22px;color:#fff;background:var(--green);border:3px solid var(--brown);border-radius:999px;box-shadow:0 5px 0 var(--green-d);cursor:pointer;text-shadow:0 2px 0 rgba(0,0,0,.2)}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--green-d)}
  .stats{display:flex;gap:18px;justify-content:center;font-size:17px;margin-top:8px}
  .stats b{display:block;font-weight:400;font-size:30px;color:var(--orange)}
  @media (max-height:460px){#tl{width:190px;transform:scale(.86);transform-origin:top left}#joy{width:112px;height:112px}#dash{width:90px;height:90px}#dash>div{width:68px;height:68px;font-size:17px}#hint{display:none}
    h1{font-size:30px}.card{width:118px;font-size:15px;padding:6px 6px 8px}#menu .tip.last{display:none}.mrow .btn{font-size:18px;padding:6px 22px 8px}.sub{margin-bottom:6px}.up{font-size:16px;padding:5px 12px 6px 8px}.up b{width:32px;height:32px;font-size:16px}.ups{gap:7px}h2{font-size:21px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="world"></div>
<div id="ui">
  <div id="night"></div><div id="hurt"></div>
  <div id="hud">
    <div id="timer" class="panel">
      <svg viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="#ffc94a" stroke="#7a4a22" stroke-width="2" stroke-linejoin="round"/></svg>
      <span id="tlabel">天黑倒计时</span> <b id="time">2:00</b><div id="bossbar"><i style="width:100%"></i></div>
    </div>
    <div id="kills">赶跑对手 0</div>
    <div id="tl">
      <div id="stat" class="panel"><div id="lv">1</div><div class="bars"><div class="bar" id="hpbar"><i style="width:100%"></i></div><div class="bar" id="xpbar"><i style="width:0%"></i></div></div></div>
      <div id="quest" class="panel"><h4><span>菜园任务</span><span id="qi">1 / 5</span></h4><div class="row"><span id="qt"></span><span id="qn"></span></div><div class="bar"><i id="qb" style="width:0%"></i></div></div>
    </div>
    <div id="mute" class="panel">声音 开</div>
    <div id="status" class="panel"></div>
    <div id="joy"><div id="knob"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="1.6" fill="#fff"/><path d="M12 4.5v5M12 14.5v5M4.5 12h5M14.5 12h5"/></svg></div></div>
    <div id="dash"><div>冲刺</div></div>
    <div id="hint">按住鼠标 或 WASD 控制方向 · 空格 / 右键 冲刺 · 把车身横过来，侧炮会自动开火</div>
  </div>
  <div id="rage"></div><div id="low"></div>
  <div id="hpArrow"><div><svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.6 4.6 0 0 1 8-3 4.6 4.6 0 0 1 8 3c0 5.800-8 11-8 11z" fill="#ef5a4c" stroke="#7a4a22" stroke-width="1.6" stroke-linejoin="round"/></svg></div></div>
  <div id="bossIntro"><div class="fl"></div><div class="st t"></div><div class="st b"></div><div class="bcard"><div class="w">危险 · 危险 · 危险</div><div class="n">大野猪</div><div class="s">菜园破坏王 来拱菜啦！</div></div></div>
  <div id="banner"></div>
</div>
<div id="menu" class="overlay on"><div class="wrap">
  <h1>菜园大作战</h1>
  <div class="tip" style="margin:0 0 4px;font-size:17px">悬停或点一下看造型，选好后开始 · 大家开局一样大</div>
  <div class="cards" id="cards"></div>
  <div class="mrow"><div class="btn alt" id="reroll">换个造型</div><div class="btn off" id="go">先选一位小车手</div></div>
  <div class="tip last">收集胡萝卜升级变大 · 天黑后大野猪会来拱菜</div>
</div></div>
<div id="lvup" class="overlay"><div class="sheet panel"><h2>升级啦！</h2><div class="sub">选一项提升</div><div class="ups" id="ups"></div></div></div>
<div id="end" class="overlay"><div class="sheet panel"><h2 id="endT"></h2><div class="sub" id="endS"></div><div class="stats" id="endStats"></div><div class="btn" id="again">再来一局</div></div></div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';

/* =============== helpers =============== */
let seed=(Date.now()&0xffffff)|1;
const rnd=(a=1,b)=>{seed=(seed*1664525+1013904223)>>>0;const r=seed/4294967296;return b===undefined?r*a:a+r*(b-a);};
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const angDiff=(a,b)=>{let d=(a-b)%(Math.PI*2);if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;return d;};
const Q=new URLSearchParams(location.search);

const matCache=new Map();
function M(color,o={}){const k='s'+color+JSON.stringify(o);if(!matCache.has(k))matCache.set(k,new THREE.MeshStandardMaterial({color,roughness:.8,metalness:0,...o}));return matCache.get(k);}
function Fur(color){const k='f'+color;if(!matCache.has(k)){const c=new THREE.Color(color);matCache.set(k,new THREE.MeshPhysicalMaterial({color,roughness:.95,sheen:1,sheenRoughness:.55,sheenColor:c.clone().lerp(new THREE.Color(0xffffff),.55)}));}return matCache.get(k);}
function Toy(color){const k='t'+color;if(!matCache.has(k))matCache.set(k,new THREE.MeshPhysicalMaterial({color,roughness:.5,clearcoat:.55,clearcoatRoughness:.3}));return matCache.get(k);}
const lampMat=new THREE.MeshStandardMaterial({color:0xfff3a8,emissive:0xffd447,emissiveIntensity:.5});
const eyeMat=new THREE.MeshPhysicalMaterial({color:0x2b1c12,roughness:.15,clearcoat:1});
const whiteMat=new THREE.MeshBasicMaterial({color:0xffffff});

const G={sph:new THREE.SphereGeometry(1,32,24),cyl:new THREE.CylinderGeometry(1,1,1,28),cone:new THREE.ConeGeometry(1,1,18),ico:new THREE.IcosahedronGeometry(1,1)};
const geoCache=new Map();
function rrShape(w,d,r){const s=new THREE.Shape(),x=-w/2,y=-d/2;s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.absarc(x+w-r,y+r,r,-Math.PI/2,0);s.lineTo(x+w,y+d-r);s.absarc(x+w-r,y+d-r,r,0,Math.PI/2);s.lineTo(x+r,y+d);s.absarc(x+r,y+d-r,r,Math.PI/2,Math.PI);s.lineTo(x,y+r);s.absarc(x+r,y+r,r,Math.PI,Math.PI*1.5);return s;}
function rbox(w,h,d,r=.18){const k=[w,h,d,r].join();if(geoCache.has(k))return geoCache.get(k);const g=new RoundedBoxGeometry(w,h,d,6,Math.min(r,Math.min(w,h,d)/2-.002));geoCache.set(k,g);return g;}
function cg(k,f){if(!geoCache.has(k))geoCache.set(k,f());return geoCache.get(k);}
function mesh(geo,mat,x=0,y=0,z=0,parent,shadow=true){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=shadow;m.receiveShadow=shadow;if(parent)parent.add(m);return m;}
function ball(mat,x,y,z,sx,sy=sx,sz=sx,parent,shadow=true){const m=mesh(G.sph,mat,x,y,z,parent,shadow);m.scale.set(sx,sy,sz);return m;}
function tube(mat,x,y,z,rt,rb,h,parent,shadow=true){const m=mesh(cg('c'+rt+','+rb+','+h,()=>new THREE.CylinderGeometry(rt,rb,h,24)),mat,x,y,z,parent,shadow);return m;}
function cap(mat,x,y,z,r,len,parent){return mesh(cg('k'+r+','+len,()=>new THREE.CapsuleGeometry(r,len,8,18)),mat,x,y,z,parent);}
function torus(mat,x,y,z,R,t,parent,arc=Math.PI*2){return mesh(cg('o'+R+','+t+','+arc,()=>new THREE.TorusGeometry(R,t,14,36,arc)),mat,x,y,z,parent);}

/* =============== renderer / scene =============== */
const renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const SKY_DAY=new THREE.Color(0xc9ecff),SKY_NIGHT=new THREE.Color(0x6a70c8);
scene.background=SKY_DAY.clone();scene.fog=new THREE.Fog(0xc9ecff,52,120);
const camera=new THREE.PerspectiveCamera(38,1,.5,400);
const hemi=new THREE.HemisphereLight(0xe6f6ff,0xa5d46a,1.5);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff1cf,2.3);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-46,right:46,top:46,bottom:-46,near:1,far:160});sun.shadow.bias=-.0005;sun.shadow.normalBias=.05;sun.shadow.radius=6;

function collide(o,r){for(const s of solids){const dx=o.x-s.x,dz=o.z-s.z,d=Math.hypot(dx,dz),min=s.r+r;if(d<min&&d>0){o.x=s.x+dx/d*min;o.z=s.z+dz/d*min;}}const L=HALF-.6-r;o.x=clamp(o.x,-L,L);o.z=clamp(o.z,-L,L);}

  if(want!==null){const d=angDiff(want,v.h);turn=clamp(d*2.2,-1,1);const tr=(3.4-(v.scale-1)*.9)*dt;v.h+=clamp(d,-tr,tr);}

  v.v+=(tv-v.v)*Math.min(1,dt*(tv>v.v?5:3));v.x+=(Math.sin(v.h)*v.v+v.kx)*dt;v.z+=(Math.cos(v.h)*v.v+v.kz)*dt;const f=1-Math.min(1,dt*6);v.kx*=f;v.kz*=f;
  collide(v,1.3*v.scale);v.energy=Math.min(100,v.energy+st.regen*dt);v.turn=turn;v.mud=mud;v.corn=corn;}

function attackersOn(t,self){let n=0;for(const o of vehicles)if(o!==self&&o.alive&&!o.isPlayer&&o.ai.mode==='fight'&&o.ai.target===t)n++;return n;}
function aiThink(a){const A=a.ai;A.think=rnd(.35,.7);const st=stats(a);let best=null,bd=17+3*a.scale,threat=null,td=14;
  for(const o of vehicles){if(o===a||!o.alive)continue;const d=Math.hypot(o.x-a.x,o.z-a.z);if(d<td){threat=o;td=d;}
    if(o.isPlayer){if(o.corn&&d>6)continue;if(attackersOn(o,a)>=(player.lv>=5?3:2))continue;if(playT<6)continue;}
    else if(attackersOn(o,a)>=1)continue;
    if(o.lv>a.lv+2)continue;const w=d*(o.isPlayer?.85:1.15);if(w<bd){best=o;bd=w;}}
  if(A.mode==='fight'&&A.target&&A.target.alive&&Math.hypot(A.target.x-a.x,A.target.z-a.z)<24&&!(A.target.isPlayer&&A.target.corn))best=A.target;
  if(A.mode!=='fight'&&best&&(A.calm>0||rnd()>A.bold*.3))best=null;
  if(a.hp<st.maxhp*.3&&threat){A.mode='flee';A.target=threat;}
  else if(best){if(A.mode!=='fight')A.fightT=rnd(7,12);A.mode='fight';A.target=best;}
  else{A.mode='forage';A.target=null;let c=null,cd=30;for(const k of carrots){const d=Math.hypot(k.x-a.x,k.z-a.z);if(d<cd){c=k;cd=d;}}A.carrot=c;if(!c&&Math.hypot(A.wx-a.x,A.wz-a.z)<4){A.wx=rnd(-HALF+8,HALF-8);A.wz=rnd(-HALF+8,HALF-8);}}}
function aiUpdate(a,dt){const A=a.ai;A.calm-=dt;if(A.mode==='fight'){A.fightT-=dt;if(A.fightT<=0){A.mode='forage';A.target=null;A.calm=rnd(4,8);A.think=0;}}A.think-=dt;if(A.think<=0)aiThink(a);A.flip-=dt;if(A.flip<=0){A.flip=rnd(3.5,7);A.side*=-1;}
  let want=a.h,thr=.8;
  if(A.mode==='flee'&&A.target){const t=A.target;want=Math.atan2(a.x-t.x,a.z-t.z);thr=1;if(Math.hypot(a.x-t.x,a.z-t.z)<8)tryDash(a);if(a.hp>stats(a).maxhp*.55)A.mode='forage';}
  else if(A.mode==='fight'&&A.target&&A.target.alive){const t=A.target,dx=t.x-a.x,dz=t.z-a.z,d=Math.hypot(dx,dz),ang=Math.atan2(dx,dz),wd=5.5*(a.scale+t.scale)/2+1.5;let off=Math.PI/2;if(d>wd*1.3)off*=.35;else if(d<wd*.65)off*=1.5;want=ang+A.side*off;thr=d>wd*1.6?1:.75;}
  else{const c=A.carrot;if(c&&carrots.includes(c))want=Math.atan2(c.x-a.x,c.z-a.z);else want=Math.atan2(A.wx-a.x,A.wz-a.z);}
  const E=HALF-7;if(Math.abs(a.x)>E||Math.abs(a.z)>E)want=Math.atan2(-a.x,-a.z)+A.side*.4;
  const px=a.x,pz=a.z;drive(a,want,thr,dt);if(thr>.5&&Math.hypot(a.x-px,a.z-pz)<dt*1.2){A.side*=-1;a.h+=A.side*1.2*dt*8;}}

    if(got){scene.remove(c.g);carrots.splice(i,1);gainXp(got,1);if(got.isPlayer){pickC=pickT>0?Math.min(14,pickC+1):0;pickT=.9;const f=Math.pow(2,pickC/12);tone(880*f,1320*f,.08,'sine',.05);floatAt('+1',got.x,3.4*got.scale,got.z,'xp');}}}
  /* hearts */
  heartT-=dt;if(heartT<=0&&phase!=='night'&&phase!=='intro'){heartT=phase==='day'?9:7;if(hearts.length<(phase==='day'?5:2))randomHeart();}
  for(let i=hearts.length-1;i>=0;i--){const h=hearts[i];h.t+=dt;h.g.position.set(h.x,1.35+Math.sin(h.t*3)*.18,h.z);h.g.rotation.y=h.t*2;const pl=1+Math.sin(h.t*6)*.08;h.g.scale.setScalar(1.25*pl);h.gl.position.set(h.x,.07,h.z);h.gl.material.opacity=.55+.25*Math.sin(h.t*6);
    let got=null;for(const v of vehicles){if(!v.alive)continue;const mh=stats(v).maxhp;if(Math.hypot(v.x-h.x,v.z-h.z)<1.3*v.scale+.7&&v.hp<mh*(v.isPlayer?.999:.7)){got=v;v.hp=Math.min(mh,v.hp+mh*.4);break;}}
    if(got){scene.remove(h.g);scene.remove(h.gl);h.gl.material.dispose();hearts.splice(i,1);if(near(h.x,h.z))puff(h.x,1.4,h.z,0xff8a9a,10,4,.8);if(near(h.x,h.z))ringFx(h.x,h.z,0xff8a9a,5,.5);if(got.isPlayer){floatAt('回血 +40%',got.x,3.8*got.scale,got.z,'big');tone(660,990,.12,'sine',.07);tone(990,1320,.16,'sine',.07,.1);}}}
  if(phase==='day'&&carrots.length<95&&rnd()<dt*5)scatterCarrot();
  if(phase==='day'){timeLeft-=dt;if(timeLeft<=0)startNight();}else if(phase==='night'){nightT+=dt;if(nightT>2.6)spawnBoss();}
  else if(phase==='intro'){introT+=dt;const k=clamp((introT-.6)/.6,0,1),e=1+2.70158*Math.pow(k-1,3)+1.70158*Math.pow(k-1,2);boss.g.scale.setScalar(1.15*Math.max(.001,e));
    if(!boss.popped&&introT>.6){boss.popped=true;shake=.8;SFX.stomp();for(let i=0;i<28;i++){const a=i/28*6.28;puff(boss.x+Math.sin(a)*3,.6,boss.z+Math.cos(a)*3,0xe9dcae,1,7,2.2);}}
    if(!boss.roared&&introT>1.3){boss.roared=true;shake=.9;SFX.roar();}
    if(boss.roared)boss.b.rotation.x=-Math.sin(clamp((introT-1.3)/.8,0,1)*Math.PI)*.25;
    if(introT>3){phase='boss';$('bossIntro').classList.remove('on');boss.g.scale.setScalar(1.15);boss.b.rotation.x=0;showBanner('绕着它转，用侧炮打！',2.4);}}
  if(pending>0&&state==='play'&&player.alive)showLevelUp();
  updateHud();}

function fx(dt){for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.t+=dt;const k=Math.min(1,r.t/r.life),e=1-Math.pow(1-k,3);r.m.scale.setScalar(Math.max(.1,r.R*e));r.m.material.opacity=.9*(1-k);if(k>=1){scene.remove(r.m);r.m.material.dispose();rings.splice(i,1);}}
  {let n=0;for(const c of carrots){if(n>=GLOWN)break;dummy.position.set(c.x,.06,c.z);dummy.rotation.set(-Math.PI/2,0,0);dummy.scale.setScalar(1.9+Math.sin(c.t*3)*.25);dummy.updateMatrix();glow.setMatrixAt(n++,dummy.matrix);}glow.count=n;glow.instanceMatrix.needsUpdate=true;}
  for(let i=puffs.length-1;i>=0;i--){const p=puffs[i];p.t+=dt;const k=p.t/p.life;p.m.position.x+=p.vx*dt;p.m.position.y+=p.vy*dt;p.m.position.z+=p.vz*dt;p.vx*=.92;p.vz*=.92;p.m.scale.setScalar(p.s*(.4+k*1.1));p.m.material.opacity=.95*(1-k*k);if(k>=1){scene.remove(p.m);p.m.material.dispose();puffs.splice(i,1);}}
  if(bannerT>0){bannerT-=dt;if(bannerT<=0)$('banner').classList.remove('on');}
  const tk=phase==='day'?0:1;nightK+=(tk-nightK)*Math.min(1,dt*.8);
  duskG=phase==='day'?clamp((50-timeLeft)/50,0,1)*.9:Math.max(0,.9-nightK*2);
  scene.background.copy(SKY_DAY).lerp(tmpC.setHex(0xffd2a8),duskG).lerp(SKY_NIGHT,nightK);scene.fog.color.copy(scene.background);hemi.intensity=1.5;hemi.color.setHex(0xe6f6ff).lerp(tmpC.setHex(0xffdcb8),duskG).lerp(tmpC.setHex(0xb9bcff),nightK);hemi.groundColor.setHex(0xa5d46a).lerp(tmpC.setHex(0x9ac49a),nightK);
  sun.intensity=2.3-nightK*.35;sun.color.setHex(0xfff1cf).lerp(tmpC.setHex(0xff9a50),duskG).lerp(tmpC.setHex(0xcfc9ff),nightK);$('night').style.opacity=nightK;lampMat.emissiveIntensity=.5+nightK*2;flies.material.opacity=nightK*.9;flies.position.y=Math.sin(simT*.8)*.4;flies.rotation.y=simT*.02;}
const AUTO=Q.has('auto');const tmpC=new THREE.Color(),CAMK=+(Q.get('cam')||1),CAMY=+(Q.get('camy')||1);

function render(dt){let cx=0,cz=0,target=1;
  if(player){cx=player.x;cz=player.z;target=1+(player.vscale-1)*.75;if(phase==='boss'&&boss.alive){target=Math.max(target,1.75);cx=player.x*.8+boss.x*.2;cz=player.z*.8+boss.z*.2;}
    if(phase==='intro'){const k=clamp(Math.min(introT/.6,(3-introT)/.5),0,1),m=k*k*(3-2*k)*.92;cx=player.x+(boss.x-player.x)*m;cz=player.z+(boss.z-player.z)*m;target=1.2;}}
  else{target=1.6;cx=Math.sin(simT*.12)*14;cz=Math.cos(simT*.12)*10;}
  camF+=(target-camF)*Math.min(1,dt*2.5);shake=Math.max(0,shake-dt*1.6);const sx=(rnd()-.5)*shake*1.2,sz=(rnd()-.5)*shake*1.2;
  const cf=camF*CAMK;camera.position.set(cx+sx,17.5*cf*CAMY,cz+13*cf+sz);camera.lookAt(cx+sx,1,cz-1.5+sz);scene.fog.near=52*camF;scene.fog.far=125*camF;
  sun.position.set(cx-26-duskG*16,46-duskG*20,cz+18);sun.target.position.set(cx,0,cz);
  for(const v of vehicles){if(v.alive)updateVis(v,dt);else if(v.koT>0){v.koT-=dt;const R=v.vis.root,k=v.koT/.75;R.position.y+=dt*16*k;R.rotation.z+=dt*11;R.rotation.x+=dt*7;R.scale.setScalar(v.vscale*(.35+.65*k));if(rnd()<dt*30)puff(R.position.x,R.position.y+1,R.position.z,0xffffff,1,1,.8);if(v.koT<=0){puff(R.position.x,R.position.y+1,R.position.z,0xfff0a0,8,5,1);R.visible=false;R.rotation.set(0,0,0);R.position.y=0;}}
    if(!v.alive)continue;tmp.set(v.x,(v.isPlayer?3.3:3.1)*v.vscale+.3,v.z).project(camera);const vis=Math.abs(tmp.x)<1.1&&Math.abs(tmp.y)<1.1;v.tag.style.display=vis?'flex':'none';if(vis){v.tag.style.left=(tmp.x*.5+.5)*innerWidth+'px';v.tag.style.top=(-tmp.y*.5+.5)*innerHeight+'px';v.tag.firstChild.textContent=v.lv>=MAXLV?'满':v.lv;v.tag.lastChild.firstChild.style.width=clamp(v.hp/stats(v).maxhp*100,0,100)+'%';}}
  fovKick=Math.max(0,fovKick-dt*2.2);{const f=baseFov+fovKick*fovKick*7;if(Math.abs(camera.fov-f)>.01){camera.fov=f;camera.updateProjectionMatrix();}}
  {const ar=$('hpArrow');let show=false;if(player&&player.alive&&state==='play'&&hearts.length&&player.hp<stats(player).maxhp*.6){let best=null,bd=1e9;for(const h of hearts){const d=Math.hypot(h.x-player.x,h.z-player.z);if(d<bd){bd=d;best=h;}}
    tmp.set(best.x,1,best.z).project(camera);if(Math.abs(tmp.x)>.9||Math.abs(tmp.y)>.85){const a=Math.atan2(best.z-player.z,best.x-player.x),R=Math.min(innerWidth,innerHeight)*.36;ar.style.left=innerWidth/2+Math.cos(a)*R*1.25+'px';ar.style.top=innerHeight/2+Math.sin(a)*R+'px';ar.style.setProperty('--a',a*180/Math.PI+'deg');show=true;}}
    ar.style.display=show?'block':'none';}
  renderer.render(scene,camera);}
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;baseFov=innerWidth/innerHeight>1.3?38:56;camera.fov=baseFov;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
let last=performance.now();
function frame(now){let dt=Math.min(.05,(now-last)/1000);last=now;if(state==='menu')menuFrame(dt);if(freeze>0){freeze-=dt;dt*=.06;}step(dt);fx(dt);render(dt);requestAnimationFrame(frame);}

/* menu */
const looks=[0,1,2].map(defaultLook);let sel=-1;
const PV={r:new THREE.WebGLRenderer({antialias:true,alpha:true}),sc:new THREE.Scene(),cam:new THREE.PerspectiveCamera(30,1,.1,60),items:[]};
PV.r.setPixelRatio(1);PV.r.setSize(340,340);PV.sc.add(new THREE.HemisphereLight(0xffffff,0xb9dc8a,1.6));{const d=new THREE.DirectionalLight(0xfff1cf,2.2);d.position.set(-4,8,6);PV.sc.add(d);}
PV.cam.position.set(0,3.3,7.9);PV.cam.lookAt(0,1.35,0);
function pvBuild(i){const it=PV.items[i];if(it.v)PV.sc.remove(it.v.root);it.v=buildVehicle(i,looks[i]);it.v.L[0].visible=it.v.R[0].visible=true;it.v.root.visible=false;PV.sc.add(it.v.root);it.pop=1;}
TYPES.forEach((T,i)=>{const d=document.createElement('div');d.className='card panel';d.innerHTML=`<canvas width="340" height="340"></canvas><div>${T.name}</div><small>${T.car}</small>`;
  const it={d,ctx:d.firstChild.getContext('2d'),yaw:i*2.1,hover:false,v:null,pop:0};PV.items.push(it);pvBuild(i);it.pop=0;
  d.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')it.hover=true;});d.addEventListener('pointerleave',()=>it.hover=false);
  d.addEventListener('click',()=>{unlockAudio();sel=i;it.pop=1;PV.items.forEach((o,k)=>o.d.classList.toggle('sel',k===i));const go=$('go');go.classList.remove('off');go.textContent='开始游戏';tone(700,1000,.1,'triangle',.06);});$('cards').appendChild(d);});
$('reroll').addEventListener('click',()=>{unlockAudio();for(let i=0;i<3;i++){looks[i]=randLook(i);pvBuild(i);}tone(500,900,.12,'triangle',.06);});
$('go').addEventListener('click',()=>{if(sel>=0)startGame(sel);});
function menuFrame(dt){if(!PV.r)return;const POSE=.62;PV.items.forEach((it,i)=>{if(it.hover||sel===i)it.yaw+=angDiff(POSE,it.yaw)*Math.min(1,dt*9);else it.yaw+=dt*1.1;it.pop=Math.max(0,it.pop-dt*3);
    const V=it.v,ps=1+Math.sin(it.pop*Math.PI)*.12;V.root.rotation.y=it.yaw;V.root.scale.setScalar(ps);V.critter.position.y=V.seatY+Math.abs(Math.sin(simT*5+i))*.035;V.critter.rotation.z=Math.sin(simT*3+i)*.05;
    PV.items.forEach(o=>o.v.root.visible=o===it);PV.r.render(PV.sc,PV.cam);it.ctx.clearRect(0,0,340,340);it.ctx.drawImage(PV.r.domElement,0,0,340,340);});}
window.__game={get player(){return player;},get boss(){return boss;},get state(){return state;},get phase(){return phase;},vehicles,carrots,shots,hearts,spawnHeart,startGame,startNight,setLevel,stats,gainXp,advance(sec){for(let i=0;i<sec*60;i++){step(1/60);fx(1/60);}render(1/60);}};
if(Q.has('pick'))startGame(+Q.get('pick'));
requestAnimationFrame(frame);
</script>
